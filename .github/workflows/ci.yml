name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node --experimental-sqlite dist/src/cli.js index . --db .codebase-memory/ci.db --max-file-bytes 250000
      - run: node --experimental-sqlite dist/src/cli.js architecture --db .codebase-memory/ci.db
