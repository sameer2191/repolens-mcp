name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node --experimental-sqlite dist/src/cli.js demo
      - run: npm pack --json
      - run: sha256sum *.tgz > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: repolens-release-package
          path: |
            *.tgz
            checksums.txt
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.tgz checksums.txt --clobber
          else
            gh release create "$tag" ./*.tgz checksums.txt --title "$tag" --notes "RepoLens MCP release package and SHA-256 checksums."
          fi
