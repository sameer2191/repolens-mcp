name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run audit:prod
      - name: Fail release on actionable GitHub security alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:security-gate
      - run: node --experimental-sqlite dist/src/cli.js demo
      - run: npm pack --json
      - run: npm sbom --sbom-format cyclonedx --json > sbom.cyclonedx.json
      - run: sha256sum *.tgz sbom.cyclonedx.json > checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repolens-release-package
          path: |
            *.tgz
            sbom.cyclonedx.json
            checksums.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify-package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: repolens-release-package
      - name: Require npm publish token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required for tag releases so npm provenance is not skipped."
            exit 1
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
      - name: Generate keyless Sigstore bundles
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(./*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one npm package tarball, found ${#packages[@]}."
            exit 1
          fi
          artifacts=("${packages[@]}" sbom.cyclonedx.json checksums.txt)
          for artifact in "${artifacts[@]}"; do
            if [ ! -s "$artifact" ]; then
              echo "Missing release artifact: $artifact"
              exit 1
            fi
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: |
            *.tgz
            sbom.cyclonedx.json
            checksums.txt
            *.sigstore.json
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF_NAME}"
          assets=(./*.tgz ./*.tgz.sigstore.json sbom.cyclonedx.json sbom.cyclonedx.json.sigstore.json checksums.txt checksums.txt.sigstore.json)
          for asset in "${assets[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "Missing release asset: $asset"
              exit 1
            fi
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --notes "RepoLens MCP release package, CycloneDX SBOM, SHA-256 checksums, and Sigstore verification bundles."
          fi
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./*.tgz --access public --provenance
