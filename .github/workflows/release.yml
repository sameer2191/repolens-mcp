name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:skip-gate
      - run: npm run installer:audit
      - run: npm run audit:prod
      - name: Fail release on actionable GitHub security alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ -z "${SECURITY_ALERTS_TOKEN:-}" ]]; then
              echo "SECURITY_ALERTS_TOKEN is required for tag releases so security alert checks stay fail-closed."
              exit 1
            fi
            GITHUB_TOKEN="${SECURITY_ALERTS_TOKEN}" npm run release:security-gate
          else
            npm run release:security-gate -- --allow-unavailable
          fi
      - run: node --experimental-sqlite dist/src/cli.js demo
      - run: npm run package:check
      - run: npm pack --json
      - run: npm sbom --sbom-format cyclonedx --json > sbom.cyclonedx.json
      - run: sha256sum *.tgz sbom.cyclonedx.json > checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repolens-release-package
          path: |
            *.tgz
            sbom.cyclonedx.json
            checksums.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify-package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: repolens-release-package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@sameermir"
      - name: Require npm publish token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required for tag releases so npm provenance is not skipped."
            exit 1
          fi
          npm whoami --registry https://registry.npmjs.org >/dev/null
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            *.tgz
            sbom.cyclonedx.json
            checksums.txt
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.tgz sbom.cyclonedx.json checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$tag" ./*.tgz sbom.cyclonedx.json checksums.txt --repo "${GITHUB_REPOSITORY}" --title "$tag" --notes "RepoLens MCP release package, CycloneDX SBOM, and SHA-256 checksums."
          fi
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./*.tgz --access public --provenance
