name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node --experimental-sqlite dist/src/cli.js demo
      - run: npm pack --json
      - run: npm sbom --sbom-format cyclonedx --json > sbom.cyclonedx.json
      - run: sha256sum *.tgz sbom.cyclonedx.json > checksums.txt
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            *.tgz
            sbom.cyclonedx.json
            checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repolens-release-package
          path: |
            *.tgz
            sbom.cyclonedx.json
            checksums.txt
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.tgz sbom.cyclonedx.json checksums.txt --clobber
          else
            gh release create "$tag" ./*.tgz sbom.cyclonedx.json checksums.txt --title "$tag" --notes "RepoLens MCP release package, CycloneDX SBOM, and SHA-256 checksums."
          fi
