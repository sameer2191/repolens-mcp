name: Feature request
description: Propose a focused RepoLens MCP improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked or unnecessarily hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the CLI command, MCP tool behavior, graph output, dashboard view, or report change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This may change the graph schema.
        - label: This may affect indexing performance.
        - label: This may touch security-sensitive file handling or generated artifacts.
